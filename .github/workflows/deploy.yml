name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

# Permissão mínima: este job só faz checkout e chama a Cloudflare com um token de secret —
# não escreve no repositório e não usa OIDC. Sem esta declaração o workflow herda o padrão
# da organização, que costuma ser ESCRITA em tudo, e esse token fica ao alcance da action
# de terceiro que roda no mesmo job.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
